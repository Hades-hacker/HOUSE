<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHAST HOUSE - Luxury Dark Booking</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');
        
        :root {
            --primary-purple: #8b5cf6;
            --deep-purple: #4c1d95;
            --neon-purple: #a855f7;
            --dark-bg: #0a0a0f;
            --card-bg: #13131f;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            color: #e2e8f0;
            overflow-x: hidden;
        }
        
        .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }
        
        .glass-panel {
            background: rgba(19, 19, 31, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
        
        .purple-glow {
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
        }
        
        .text-gradient {
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .hover-lift {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
        }
        
        .hover-lift:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(139, 92, 246, 0.2);
        }
        
        .gradient-border {
            position: relative;
            background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
                        linear-gradient(135deg, #8b5cf6, #ec4899) border-box;
            border: 2px solid transparent;
        }
        
        .search-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(139, 92, 246, 0.3);
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .loader {
            border: 3px solid rgba(139, 92, 246, 0.1);
            border-top: 3px solid #a855f7;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hero-bg {
            background: 
                radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                linear-gradient(to bottom, var(--dark-bg), #0f0f1a);
        }
        
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        
        .scroll-hide::-webkit-scrollbar {
            display: none;
        }
        .scroll-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        
        .card-shine {
            position: relative;
            overflow: hidden;
        }
        
        .card-shine::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.05) 50%,
                transparent 70%
            );
            transform: rotate(45deg);
            transition: all 0.6s;
            opacity: 0;
        }
        
        .card-shine:hover::before {
            opacity: 1;
            left: 100%;
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
            Search, MapPin, Calendar, Users, Star, Heart, 
            Menu, X, ChevronRight, Wifi, Car, Coffee, 
            Waves, Dumbbell, Sparkles, ArrowRight, Check,
            Moon, Sun, Filter, Grid, List
        } = lucide;
        
        // Mock Backend API
        const API = {
            hotels: [
                {
                    id: 1,
                    name: "Neon Palace Tokyo",
                    location: "Shibuya, Tokyo",
                    price: 289,
                    rating: 4.9,
                    reviews: 1284,
                    image: "https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=800&q=80",
                    amenities: ["wifi", "pool", "gym", "spa"],
                    description: "Cyberpunk luxury in the heart of Tokyo's electric district.",
                    discount: 15
                },
                {
                    id: 2,
                    name: "Velvet Horizon Paris",
                    location: "Le Marais, Paris",
                    price: 445,
                    rating: 4.8,
                    reviews: 892,
                    image: "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=800&q=80",
                    amenities: ["wifi", "spa", "bar", "concierge"],
                    description: "Where Haussmann architecture meets modern purple neon dreams.",
                    discount: 0
                },
                {
                    id: 3,
                    name: "Obsidian Bay Resort",
                    location: "Maldives",
                    price: 899,
                    rating: 5.0,
                    reviews: 456,
                    image: "https://images.unsplash.com/photo-1571896349842-33c89424de2d?w=800&q=80",
                    amenities: ["wifi", "pool", "spa", "gym", "bar"],
                    description: "Ultra-luxury overwater villas with private infinity pools.",
                    discount: 20
                },
                {
                    id: 4,
                    name: "Purple Haze NYC",
                    location: "Manhattan, New York",
                    price: 567,
                    rating: 4.7,
                    reviews: 2103,
                    image: "https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?w=800&q=80",
                    amenities: ["wifi", "gym", "bar", "concierge"],
                    description: "Rooftop infinity pool overlooking the Manhattan skyline.",
                    discount: 10
                },
                {
                    id: 5,
                    name: "Midnight Garden Kyoto",
                    location: "Gion, Kyoto",
                    price: 334,
                    rating: 4.9,
                    reviews: 678,
                    image: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=800&q=80",
                    amenities: ["wifi", "spa", "garden", "tea"],
                    description: "Traditional ryokan reimagined with contemporary dark aesthetics.",
                    discount: 0
                },
                {
                    id: 6,
                    name: "Cosmic Sands Dubai",
                    location: "Palm Jumeirah, Dubai",
                    price: 1200,
                    rating: 4.9,
                    reviews: 334,
                    image: "https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=800&q=80",
                    amenities: ["wifi", "pool", "spa", "gym", "bar", "concierge"],
                    description: "Futuristic architecture meets Arabian luxury under the stars.",
                    discount: 25
                }
            ],
            
            bookings: [],
            
            searchHotels: async (filters) => {
                await new Promise(resolve => setTimeout(resolve, 800));
                let results = [...API.hotels];
                
                if (filters.location) {
                    results = results.filter(h => 
                        h.location.toLowerCase().includes(filters.location.toLowerCase())
                    );
                }
                if (filters.minPrice) {
                    results = results.filter(h => h.price >= filters.minPrice);
                }
                if (filters.maxPrice) {
                    results = results.filter(h => h.price <= filters.maxPrice);
                }
                if (filters.amenities?.length > 0) {
                    results = results.filter(h => 
                        filters.amenities.every(a => h.amenities.includes(a))
                    );
                }
                
                return results;
            },
            
            createBooking: async (bookingData) => {
                await new Promise(resolve => setTimeout(resolve, 1000));
                const booking = {
                    id: Date.now(),
                    ...bookingData,
                    status: 'confirmed',
                    createdAt: new Date().toISOString()
                };
                API.bookings.push(booking);
                return booking;
            },
            
            getBookings: async () => {
                await new Promise(resolve => setTimeout(resolve, 500));
                return API.bookings;
            }
        };

        const AmenityIcon = ({ type }) => {
            const icons = {
                wifi: <Wifi size={16} />,
                pool: <Waves size={16} />,
                gym: <Dumbbell size={16} />,
                spa: <Sparkles size={16} />,
                bar: <Coffee size={16} />,
                car: <Car size={16} />,
                concierge: <Users size={16} />,
                garden: <Sparkles size={16} />,
                tea: <Coffee size={16} />
            };
            return icons[type] || <Star size={16} />;
        };

        const Navbar = ({ cartCount }) => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            
            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);
            
            return (
                <nav className={`fixed top-0 w-full z-50 transition-all duration-300 ${isScrolled ? 'glass-panel py-3' : 'bg-transparent py-6'}`}>
                    <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="w-10 h-10 bg-gradient-to-br from-purple-600 to-pink-600 rounded-xl flex items-center justify-center">
                                <span className="text-white font-bold text-lg">B</span>
                            </div>
                            <span className="font-display font-bold text-2xl tracking-tight text-white">
                                BHAST<span className="text-purple-400">HOUSE</span>
                            </span>
                        </div>
                        
                        <div className="hidden md:flex items-center gap-8">
                            <a href="#" className="text-gray-300 hover:text-purple-400 transition-colors">Destinations</a>
                            <a href="#" className="text-gray-300 hover:text-purple-400 transition-colors">Deals</a>
                            <a href="#" className="text-gray-300 hover:text-purple-400 transition-colors">My Trips</a>
                            <button className="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2.5 rounded-full font-medium transition-all hover:shadow-lg hover:shadow-purple-500/30">
                                Sign In
                            </button>
                        </div>
                        
                        <button className="md:hidden text-white" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                            {mobileMenuOpen ? <X /> : <Menu />}
                        </button>
                    </div>
                    
                    {mobileMenuOpen && (
                        <div className="md:hidden glass-panel mt-4 mx-6 p-6 rounded-2xl">
                            <div className="flex flex-col gap-4">
                                <a href="#" className="text-gray-300">Destinations</a>
                                <a href="#" className="text-gray-300">Deals</a>
                                <a href="#" className="text-gray-300">My Trips</a>
                                <button className="bg-purple-600 text-white px-6 py-3 rounded-full w-full">Sign In</button>
                            </div>
                        </div>
                    )}
                </nav>
            );
        };

        const Hero = ({ onSearch }) => {
            const [searchData, setSearchData] = useState({
                location: '',
                checkIn: '',
                checkOut: '',
                guests: 2
            });
            
            const handleSearch = (e) => {
                e.preventDefault();
                onSearch(searchData);
            };
            
            return (
                <div className="hero-bg min-h-screen flex items-center justify-center pt-20 px-6 relative overflow-hidden">
                    <div className="absolute inset-0 opacity-30">
                        <div className="absolute top-20 left-10 w-72 h-72 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl animate-pulse"></div>
                        <div className="absolute bottom-20 right-10 w-96 h-96 bg-pink-600 rounded-full mix-blend-multiply filter blur-3xl animate-pulse delay-1000"></div>
                    </div>
                    
                    <div className="max-w-5xl w-full relative z-10">
                        <div className="text-center mb-12">
                            <h1 className="font-display text-5xl md:text-7xl font-bold mb-6 leading-tight">
                                Discover Your <br />
                                <span className="text-gradient">Perfect Escape</span>
                            </h1>
                            <p className="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto">
                                Curated luxury stays in the world's most vibrant destinations. 
                                Dark aesthetics, premium comfort.
                            </p>
                        </div>
                        
                        <div className="glass-panel rounded-3xl p-2 md:p-4 shadow-2xl purple-glow">
                            <form onSubmit={handleSearch} className="grid md:grid-cols-4 gap-4">
                                <div className="relative group">
                                    <MapPin className="absolute left-4 top-1/2 -translate-y-1/2 text-purple-400" size={20} />
                                    <input 
                                        type="text" 
                                        placeholder="Where to?"
                                        className="search-input w-full pl-12 pr-4 py-4 rounded-2xl text-white placeholder-gray-500"
                                        value={searchData.location}
                                        onChange={(e) => setSearchData({...searchData, location: e.target.value})}
                                    />
                                </div>
                                
                                <div className="relative">
                                    <Calendar className="absolute left-4 top-1/2 -translate-y-1/2 text-purple-400" size={20} />
                                    <input 
                                        type="date" 
                                        className="search-input w-full pl-12 pr-4 py-4 rounded-2xl text-white"
                                        value={searchData.checkIn}
                                        onChange={(e) => setSearchData({...searchData, checkIn: e.target.value})}
                                    />
                                </div>
                                
                                <div className="relative">
                                    <Users className="absolute left-4 top-1/2 -translate-y-1/2 text-purple-400" size={20} />
                                    <select 
                                        className="search-input w-full pl-12 pr-4 py-4 rounded-2xl text-white appearance-none cursor-pointer"
                                        value={searchData.guests}
                                        onChange={(e) => setSearchData({...searchData, guests: e.target.value})}
                                    >
                                        {[1,2,3,4,5,6].map(n => (
                                            <option key={n} value={n} className="bg-gray-900">{n} Guest{n>1?'s':''}</option>
                                        ))}
                                    </select>
                                </div>
                                
                                <button 
                                    type="submit"
                                    className="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-semibold py-4 px-8 rounded-2xl flex items-center justify-center gap-2 transition-all hover:scale-105 active:scale-95"
                                >
                                    <Search size={20} />
                                    Search
                                </button>
                            </form>
                        </div>
                        
                        <div className="flex justify-center gap-8 mt-12 text-gray-400 text-sm">
                            <div className="flex items-center gap-2">
                                <Check size={16} className="text-purple-400" />
                                <span>Free cancellation</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <Check size={16} className="text-purple-400" />
                                <span>Price match guarantee</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <Check size={16} className="text-purple-400" />
                                <span>24/7 support</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const HotelCard = ({ hotel, onBook }) => {
            const [isLiked, setIsLiked] = useState(false);
            const [imageLoaded, setImageLoaded] = useState(false);
            
            return (
                <div className="group relative bg-gray-900/50 rounded-3xl overflow-hidden hover-lift card-shine border border-purple-500/10">
                    <div className="relative h-64 overflow-hidden">
                        {!imageLoaded && (
                            <div className="absolute inset-0 bg-gray-800 animate-pulse flex items-center justify-center">
                                <div className="loader"></div>
                            </div>
                        )}
                        <img 
                            src={hotel.image} 
                            alt={hotel.name}
                            className={`w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 ${imageLoaded ? 'opacity-100' : 'opacity-0'}`}
                            onLoad={() => setImageLoaded(true)}
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent opacity-60"></div>
                        
                        {hotel.discount > 0 && (
                            <div className="absolute top-4 left-4 bg-gradient-to-r from-pink-600 to-purple-600 text-white px-3 py-1 rounded-full text-sm font-bold">
                                -{hotel.discount}%
                            </div>
                        )}
                        
                        <button 
                            onClick={() => setIsLiked(!isLiked)}
                            className="absolute top-4 right-4 p-2 rounded-full bg-black/30 backdrop-blur-md hover:bg-black/50 transition-all"
                        >
                            <Heart 
                                size={20} 
                                className={isLiked ? "fill-pink-500 text-pink-500" : "text-white"} 
                            />
                        </button>
                        
                        <div className="absolute bottom-4 left-4 right-4">
                            <div className="flex items-center gap-1 text-yellow-400 mb-1">
                                {[...Array(5)].map((_, i) => (
                                    <Star 
                                        key={i} 
                                        size={14} 
                                        fill={i < Math.floor(hotel.rating) ? "currentColor" : "none"} 
                                        className={i < Math.floor(hotel.rating) ? "" : "text-gray-600"}
                                    />
                                ))}
                                <span className="text-white text-sm ml-1">{hotel.rating}</span>
                                <span className="text-gray-400 text-xs">({hotel.reviews})</span>
                            </div>
                        </div>
                    </div>
                    
                    <div className="p-6">
                        <div className="flex justify-between items-start mb-2">
                            <div>
                                <h3 className="font-display font-bold text-xl text-white mb-1 group-hover:text-purple-400 transition-colors">
                                    {hotel.name}
                                </h3>
                                <div className="flex items-center gap-1 text-gray-400 text-sm">
                                    <MapPin size={14} />
                                    {hotel.location}
                                </div>
                            </div>
                            <div className="text-right">
                                <div className="text-2xl font-bold text-white">${hotel.price}</div>
                                <div className="text-gray-500 text-xs">per night</div>
                            </div>
                        </div>
                        
                        <p className="text-gray-400 text-sm mb-4 line-clamp-2">{hotel.description}</p>
                        
                        <div className="flex gap-2 mb-6 flex-wrap">
                            {hotel.amenities.slice(0, 4).map(amenity => (
                                <div key={amenity} className="flex items-center gap-1 text-xs text-gray-400 bg-white/5 px-2 py-1 rounded-lg">
                                    <AmenityIcon type={amenity} />
                                    <span className="capitalize">{amenity}</span>
                                </div>
                            ))}
                        </div>
                        
                        <button 
                            onClick={() => onBook(hotel)}
                            className="w-full bg-white/5 hover:bg-purple-600 border border-purple-500/30 hover:border-purple-500 text-white font-semibold py-3 rounded-xl transition-all flex items-center justify-center gap-2 group/btn"
                        >
                            Book Now
                            <ArrowRight size={16} className="group-hover/btn:translate-x-1 transition-transform" />
                        </button>
                    </div>
                </div>
            );
        };

        const BookingModal = ({ hotel, onClose, onConfirm }) => {
            const [step, setStep] = useState(1);
            const [loading, setLoading] = useState(false);
            const [bookingData, setBookingData] = useState({
                name: '',
                email: '',
                phone: '',
                specialRequests: ''
            });
            
            const handleConfirm = async () => {
                setLoading(true);
                try {
                    await API.createBooking({
                        hotelId: hotel.id,
                        hotelName: hotel.name,
                        ...bookingData,
                        totalPrice: hotel.price * 3, // Mock 3 nights
                        date: new Date().toISOString()
                    });
                    setStep(3);
                } catch (error) {
                    alert('Booking failed');
                } finally {
                    setLoading(false);
                }
            };
            
            if (!hotel) return null;
            
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                    <div className="glass-panel rounded-3xl max-w-md w-full max-h-[90vh] overflow-y-auto p-6 relative">
                        <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-white">
                            <X size={24} />
                        </button>
                        
                        {step === 1 && (
                            <>
                                <h2 className="font-display text-2xl font-bold mb-4">Complete Your Booking</h2>
                                <div className="bg-purple-900/20 rounded-2xl p-4 mb-6 border border-purple-500/20">
                                    <div className="flex gap-4">
                                        <img src={hotel.image} className="w-20 h-20 rounded-xl object-cover" alt="" />
                                        <div>
                                            <h3 className="font-bold text-white">{hotel.name}</h3>
                                            <p className="text-gray-400 text-sm">{hotel.location}</p>
                                            <p className="text-purple-400 font-bold mt-1">${hotel.price}/night</p>
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="space-y-4">
                                    <input 
                                        type="text" 
                                        placeholder="Full Name"
                                        className="search-input w-full px-4 py-3 rounded-xl text-white"
                                        value={bookingData.name}
                                        onChange={e => setBookingData({...bookingData, name: e.target.value})}
                                    />
                                    <input 
                                        type="email" 
                                        placeholder="Email Address"
                                        className="search-input w-full px-4 py-3 rounded-xl text-white"
                                        value={bookingData.email}
                                        onChange={e => setBookingData({...bookingData, email: e.target.value})}
                                    />
                                    <input 
                                        type="tel" 
                                        placeholder="Phone Number"
                                        className="search-input w-full px-4 py-3 rounded-xl text-white"
                                        value={bookingData.phone}
                                        onChange={e => setBookingData({...bookingData, phone: e.target.value})}
                                    />
                                    <textarea 
                                        placeholder="Special Requests (optional)"
                                        className="search-input w-full px-4 py-3 rounded-xl text-white h-24 resize-none"
                                        value={bookingData.specialRequests}
                                        onChange={e => setBookingData({...bookingData, specialRequests: e.target.value})}
                                    />
                                </div>
                                
                                <button 
                                    onClick={() => setStep(2)}
                                    disabled={!bookingData.name || !bookingData.email}
                                    className="w-full mt-6 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-4 rounded-xl disabled:opacity-50 disabled:cursor-not-allowed hover:shadow-lg hover:shadow-purple-500/30 transition-all"
                                >
                                    Continue to Payment
                                </button>
                            </>
                        )}
                        
                        {step === 2 && (
                            <>
                                <h2 className="font-display text-2xl font-bold mb-4">Payment Details</h2>
                                <div className="space-y-4">
                                    <div className="p-4 bg-white/5 rounded-xl border border-purple-500/20">
                                        <div className="flex justify-between mb-2">
                                            <span className="text-gray-400">3 nights</span>
                                            <span className="text-white">${hotel.price * 3}</span>
                                        </div>
                                        <div className="flex justify-between mb-2">
                                            <span className="text-gray-400">Taxes & fees</span>
                                            <span className="text-white">${Math.round(hotel.price * 3 * 0.15)}</span>
                                        </div>
                                        <div className="border-t border-gray-700 pt-2 mt-2 flex justify-between font-bold text-lg">
                                            <span className="text-white">Total</span>
                                            <span className="text-purple-400">${Math.round(hotel.price * 3 * 1.15)}</span>
                                        </div>
                                    </div>
                                    
                                    <input 
                                        type="text" 
                                        placeholder="Card Number"
                                        className="search-input w-full px-4 py-3 rounded-xl text-white"
                                        defaultValue="4242 4242 4242 4242"
                                    />
                                    <div className="grid grid-cols-2 gap-4">
                                        <input 
                                            type="text" 
                                            placeholder="MM/YY"
                                            className="search-input w-full px-4 py-3 rounded-xl text-white"
                                            defaultValue="12/25"
                                        />
                                        <input 
                                            type="text" 
                                            placeholder="CVC"
                                            className="search-input w-full px-4 py-3 rounded-xl text-white"
                                            defaultValue="123"
                                        />
                                    </div>
                                </div>
                                
                                <button 
                                    onClick={handleConfirm}
                                    disabled={loading}
                                    className="w-full mt-6 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2"
                                >
                                    {loading ? <div className="loader w-5 h-5 border-2"></div> : 'Confirm Booking'}
                                </button>
                            </>
                        )}
                        
                        {step === 3 && (
                            <div className="text-center py-8">
                                <div className="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <Check size={40} className="text-green-400" />
                                </div>
                                <h2 className="font-display text-2xl font-bold mb-2">Booking Confirmed!</h2>
                                <p className="text-gray-400 mb-6">Your reservation at {hotel.name} has been confirmed. Check your email for details.</p>
                                <button 
                                    onClick={onClose}
                                    className="bg-purple-600 text-white px-8 py-3 rounded-full font-semibold hover:bg-purple-700 transition-colors"
                                >
                                    Done
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const FilterBar = ({ filters, setFilters, viewMode, setViewMode }) => {
            const [priceRange, setPriceRange] = useState([0, 2000]);
            const amenities = ['wifi', 'pool', 'spa', 'gym', 'bar'];
            
            return (
                <div className="glass-panel rounded-2xl p-6 mb-8 sticky top-24 z-30">
                    <div className="flex flex-col md:flex-row gap-6 items-start md:items-center justify-between">
                        <div className="flex gap-4 overflow-x-auto scroll-hide pb-2 md:pb-0">
                            {amenities.map(amenity => (
                                <button
                                    key={amenity}
                                    onClick={() => {
                                        const newAmenities = filters.amenities?.includes(amenity)
                                            ? filters.amenities.filter(a => a !== amenity)
                                            : [...(filters.amenities || []), amenity];
                                        setFilters({...filters, amenities: newAmenities});
                                    }}
                                    className={`flex items-center gap-2 px-4 py-2 rounded-full border transition-all whitespace-nowrap ${
                                        filters.amenities?.includes(amenity)
                                            ? 'bg-purple-600 border-purple-600 text-white'
                                            : 'border-purple-500/30 text-gray-400 hover:border-purple-500'
                                    }`}
                                >
                                    <AmenityIcon type={amenity} />
                                    <span className="capitalize">{amenity}</span>
                                </button>
                            ))}
                        </div>
                        
                        <div className="flex items-center gap-4">
                            <div className="flex items-center gap-2 bg-white/5 rounded-lg p-1">
                                <button 
                                    onClick={() => setViewMode('grid')}
                                    className={`p-2 rounded-md transition-all ${viewMode === 'grid' ? 'bg-purple-600 text-white' : 'text-gray-400'}`}
                                >
                                    <Grid size={18} />
                                </button>
                                <button 
                                    onClick={() => setViewMode('list')}
                                    className={`p-2 rounded-md transition-all ${viewMode === 'list' ? 'bg-purple-600 text-white' : 'text-gray-400'}`}
                                >
                                    <List size={18} />
                                </button>
                            </div>
                            
                            <select 
                                className="search-input px-4 py-2 rounded-lg text-white text-sm"
                                value={filters.sort || 'recommended'}
                                onChange={e => setFilters({...filters, sort: e.target.value})}
                            >
                                <option value="recommended">Recommended</option>
                                <option value="price-low">Price: Low to High</option>
                                <option value="price-high">Price: High to Low</option>
                                <option value="rating">Highest Rated</option>
                            </select>
                        </div>
                    </div>
                    
                    <div className="mt-4 pt-4 border-t border-purple-500/10 flex items-center gap-4">
                        <span className="text-gray-400 text-sm">Price range:</span>
                        <input 
                            type="range" 
                            min="0" 
                            max="2000" 
                            value={filters.maxPrice || 2000}
                            onChange={e => setFilters({...filters, maxPrice: parseInt(e.target.value)})}
                            className="flex-1 max-w-xs accent-purple-600"
                        />
                        <span className="text-white font-semibold">${filters.maxPrice || 2000}</span>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [hotels, setHotels] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedHotel, setSelectedHotel] = useState(null);
            const [filters, setFilters] = useState({});
            const [viewMode, setViewMode] = useState('grid');
            const [bookings, setBookings] = useState([]);
            
            useEffect(() => {
                loadHotels();
                loadBookings();
            }, []);
            
            const loadHotels = async () => {
                setLoading(true);
                const results = await API.searchHotels({});
                setHotels(results);
                setLoading(false);
            };
            
            const loadBookings = async () => {
                const userBookings = await API.getBookings();
                setBookings(userBookings);
            };
            
            const handleSearch = async (searchData) => {
                setLoading(true);
                const results = await API.searchHotels({
                    location: searchData.location,
                    ...filters
                });
                setHotels(results);
                setLoading(false);
                
                // Scroll to results
                document.getElementById('results')?.scrollIntoView({ behavior: 'smooth' });
            };
            
            useEffect(() => {
                if (filters.amenities || filters.maxPrice) {
                    handleSearch({ location: '' });
                }
            }, [filters]);
            
            return (
                <div className="min-h-screen bg-[#0a0a0f]">
                    <Navbar cartCount={bookings.length} />
                    
                    <Hero onSearch={handleSearch} />
                    
                    <div id="results" className="max-w-7xl mx-auto px-6 py-20">
                        <div className="flex justify-between items-end mb-8">
                            <div>
                                <h2 className="font-display text-3xl md:text-4xl font-bold mb-2">
                                    Featured <span className="text-gradient">Properties</span>
                                </h2>
                                <p className="text-gray-400">Handpicked luxury stays for the discerning traveler</p>
                            </div>
                            <div className="hidden md:block text-gray-400">
                                Showing {hotels.length} properties
                            </div>
                        </div>
                        
                        <FilterBar 
                            filters={filters} 
                            setFilters={setFilters}
                            viewMode={viewMode}
                            setViewMode={setViewMode}
                        />
                        
                        {loading ? (
                            <div className="flex items-center justify-center py-20">
                                <div className="loader"></div>
                            </div>
                        ) : (
                            <div className={`grid gap-6 ${
                                viewMode === 'grid' 
                                    ? 'grid-cols-1 md:grid-cols-2 lg:grid-cols-3' 
                                    : 'grid-cols-1'
                            }`}>
                                {hotels.map(hotel => (
                                    <HotelCard 
                                        key={hotel.id} 
                                        hotel={hotel} 
                                        onBook={setSelectedHotel}
                                    />
                                ))}
                            </div>
                        )}
                        
                        {!loading && hotels.length === 0 && (
                            <div className="text-center py-20">
                                <div className="text-6xl mb-4">🔍</div>
                                <h3 className="text-2xl font-bold text-white mb-2">No properties found</h3>
                                <p className="text-gray-400">Try adjusting your filters or search criteria</p>
                            </div>
                        )}
                    </div>
                    
                    <div className="bg-gradient-to-b from-transparent to-purple-900/20 py-20">
                        <div className="max-w-7xl mx-auto px-6">
                            <div className="glass-panel rounded-3xl p-8 md:p-12 text-center relative overflow-hidden">
                                <div className="absolute inset-0 bg-gradient-to-r from-purple-600/20 to-pink-600/20"></div>
                                <div className="relative z-10">
                                    <h2 className="font-display text-3xl md:text-5xl font-bold mb-4">
                                        Ready for your next <span className="text-gradient">adventure?</span>
                                    </h2>
                                    <p className="text-gray-300 max-w-2xl mx-auto mb-8 text-lg">
                                        Join over 50,000 travelers who trust BHAST HOUSE for their luxury accommodations.
                                        Exclusive deals and VIP treatment await.
                                    </p>
                                    <div className="flex flex-col sm:flex-row gap-4 justify-center">
                                        <button className="bg-white text-gray-900 px-8 py-4 rounded-full font-bold hover:bg-gray-100 transition-colors">
                                            Create Account
                                        </button>
                                        <button className="border border-purple-500 text-white px-8 py-4 rounded-full font-bold hover:bg-purple-600/20 transition-colors">
                                            View All Deals
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <footer className="border-t border-purple-500/10 py-12 mt-20">
                        <div className="max-w-7xl mx-auto px-6">
                            <div className="grid md:grid-cols-4 gap-8 mb-8">
                                <div>
                                    <div className="flex items-center gap-2 mb-4">
                                        <div className="w-8 h-8 bg-gradient-to-br from-purple-600 to-pink-600 rounded-lg flex items-center justify-center">
                                            <span className="text-white font-bold">B</span>
                                        </div>
                                        <span className="font-display font-bold text-xl text-white">
                                            BHAST<span className="text-purple-400">HOUSE</span>
                                        </span>
                                    </div>
                                    <p className="text-gray-400 text-sm">Redefining luxury travel with dark aesthetics and premium comfort.</p>
                                </div>
                                <div>
                                    <h4 className="font-bold text-white mb-4">Company</h4>
                                    <ul className="space-y-2 text-gray-400 text-sm">
                                        <li><a href="#" className="hover:text-purple-400">About Us</a></li>
                                        <li><a href="#" className="hover:text-purple-400">Careers</a></li>
                                        <li><a href="#" className="hover:text-purple-400">Press</a></li>
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="font-bold text-white mb-4">Support</h4>
                                    <ul className="space-y-2 text-gray-400 text-sm">
                                        <li><a href="#" className="hover:text-purple-400">Help Center</a></li>
                                        <li><a href="#" className="hover:text-purple-400">Terms of Service</a></li>
                                        <li><a href="#" className="hover:text-purple-400">Privacy Policy</a></li>
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="font-bold text-white mb-4">Connect</h4>
                                    <div className="flex gap-4">
                                        {['Twitter', 'Instagram', 'Discord'].map(social => (
                                            <div key={social} className="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center hover:bg-purple-600/20 cursor-pointer transition-colors">
                                                <span className="text-xs text-gray-400">{social[0]}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            <div className="border-t border-purple-500/10 pt-8 text-center text-gray-500 text-sm">
                                © 2026 BHAST HOUSE. All rights reserved. Dark luxury redefined.
                            </div>
                        </div>
                    </footer>
                    
                    {selectedHotel && (
                        <BookingModal 
                            hotel={selectedHotel} 
                            onClose={() => setSelectedHotel(null)}
                            onConfirm={loadBookings}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
