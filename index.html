            searchHotels: async (filters) => {
                await new Promise(resolve => setTimeout(resolve, 600));
                let results = [...API.hotels];
                
                if (filters.location) {
                    results = results.filter(h => 
                        h.location.toLowerCase().includes(filters.location.toLowerCase()) ||
                        h.name.toLowerCase().includes(filters.location.toLowerCase())
                    );
                }
                if (filters.minPrice) {
                    results = results.filter(h => h.price >= filters.minPrice);
                }
                if (filters.maxPrice) {
                    results = results.filter(h => h.price <= filters.maxPrice);
                }
                if (filters.amenities?.length > 0) {
                    results = results.filter(h => 
                        filters.amenities.every(a => h.amenities.includes(a))
                    );
                }
                if (filters.propertyType) {
                    results = results.filter(h => h.propertyType === filters.propertyType);
                }
                if (filters.season) {
                    results = results.filter(h => h.season === filters.season);
                }
                if (filters.sort === 'price-low') {
                    results.sort((a, b) => a.price - b.price);
                } else if (filters.sort === 'price-high') {
                    results.sort((a, b) => b.price - a.price);
                } else if (filters.sort === 'rating') {
                    results.sort((a, b) => b.rating - a.rating);
                }
                
                return results;
            },
            
            createBooking: async (bookingData) => {
                await new Promise(resolve => setTimeout(resolve, 1200));
                const booking = {
                    id: Date.now(),
                    ...bookingData,
                    status: 'confirmed',
                    createdAt: new Date().toISOString(),
                    confirmationCode: 'BH' + Math.random().toString(36).substr(2, 6).toUpperCase()
                };
                API.bookings.push(booking);
                return booking;
            },
            
            getBookings: async () => {
                await new Promise(resolve => setTimeout(resolve, 400));
                return API.bookings;

                    id: Date.now(),
                    ...propertyData,
                    hostId: API.currentUser.id,
                    hostName: API.currentUser.name,
                    rating: 0,
                    reviews: 0,
                    isAvailable: true,
                    createdAt: new Date().toISOString()
                };
                API.hotels.unshift(newProperty);
                return newProperty;
            },
            
            deleteProperty: async (id) => {

                API.hotels = API.hotels.filter(h => h.id !== id);
